<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✦ Starpost</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ── HEADER ── */
    .header {
      background: #0f0f0f;
      border-bottom: 1px solid #1e1e1e;
      padding: 16px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-title {
      font-size: 1.3rem;
      font-family: Georgia, serif;
      font-style: italic;
      color: #c9b1f0;
      letter-spacing: 0.05em;
    }

    .header-sub {
      font-size: 0.7rem;
      color: #444;
      margin-top: 2px;
      letter-spacing: 0.08em;
    }

    /* ── COMPOSE BOX ── */
    .compose-wrap {
      max-width: 580px;
      margin: 24px auto 0;
      padding: 0 16px;
    }

    .compose-box {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 16px;
    }

    .compose-top {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .lily-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #c9b1f0;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .lily-avatar img {
      width: 100%; height: 100%;
      object-fit: cover; border-radius: 50%;
    }

    .compose-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #f0f0f0;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.6;
      min-height: 80px;
    }

    .compose-input::placeholder { color: #333; }

    .compose-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #1e1e1e;
    }

    .char-count { font-size: 0.72rem; color: #444; }
    .char-count.warn { color: #e05c5c; }

    .post-btn {
      background: linear-gradient(135deg, #c9b1f0, #9b5de5);
      border: none;
      border-radius: 20px;
      padding: 8px 22px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .post-btn:hover { opacity: 0.85; }
    .post-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── FEED ── */
    .feed {
      max-width: 580px;
      margin: 20px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── POST CARD ── */
    .post-card {
      background: #141414;
      border: 1px solid #1e1e1e;
      border-radius: 16px;
      overflow: hidden;
      animation: fadeUp 0.4s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 10px;
    }

    .post-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #c9b1f0;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .post-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    .post-username { font-size: 0.88rem; font-weight: 700; color: #c9b1f0; }
    .post-time { font-size: 0.7rem; color: #444; margin-top: 1px; }

    .post-body {
      padding: 0 16px 14px;
      font-size: 0.92rem;
      line-height: 1.7;
      color: #ddd;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── POST ACTIONS ── */
    .post-actions {
      padding: 10px 16px;
      border-top: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .like-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: #555;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.2s;
      padding: 0;
    }

    .like-btn svg {
      width: 18px; height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      transition: stroke 0.2s, fill 0.2s;
    }

    .like-btn.liked { color: #e05c5c; }
    .like-btn.liked svg { stroke: #e05c5c; fill: #e05c5c; }

    .comment-count {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #444;
    }

    .comment-count svg {
      width: 16px; height: 16px;
      stroke: #444; fill: none;
      stroke-width: 1.8;
    }

    .post-date-full {
      margin-left: auto;
      font-size: 0.68rem;
      color: #333;
      letter-spacing: 0.04em;
    }

    /* ── COMMENTS ── */
    .comments-section {
      border-top: 1px solid #1a1a1a;
    }

    .comment-item {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid #111;
      animation: fadeUp 0.35s ease;
    }

    .comment-item:last-child { border-bottom: none; }

    .comment-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem;
      font-weight: 800;
      flex-shrink: 0;
      overflow: hidden;
    }

    .comment-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    .comment-body { flex: 1; }

    .comment-name {
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .comment-text {
      font-size: 0.84rem;
      line-height: 1.5;
      color: #bbb;
    }

    /* ── TYPING COMMENT ── */
    .comment-typing {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid #111;
      align-items: center;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      background: #1e1e1e;
      padding: 7px 12px;
      border-radius: 12px;
    }

    .typing-dots span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #555;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }

    /* ── PASSWORD OVERLAY ── */
    .pw-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10,10,10,0.97);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 40px 24px;
      animation: fadeUp 0.4s ease;
    }
    .pw-lock { font-size: 2.5rem; }
    .pw-title { font-size: 1.2rem; font-family: Georgia, serif; font-style: italic; color: #c9b1f0; }
    .pw-sub { font-size: 0.8rem; color: #444; }
    .pw-input {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 12px; padding: 11px 18px;
      color: #f0f0f0; font-size: 0.95rem; font-family: inherit;
      width: 220px; text-align: center; letter-spacing: 0.1em;
      outline: none; transition: border-color 0.2s;
    }
    .pw-input:focus { border-color: #c9b1f0; }
    .pw-btn {
      background: linear-gradient(135deg, #c9b1f0, #9b5de5);
      border: none; border-radius: 12px; padding: 11px 28px;
      color: #fff; font-size: 0.88rem; font-weight: 600;
      font-family: inherit; cursor: pointer; width: 220px; transition: opacity 0.2s;
    }
    .pw-btn:hover { opacity: 0.85; }
    .pw-error { font-size: 0.78rem; color: #e05c5c; display: none; }
    .pw-error.show { display: block; }
    .compose-wrap { display: none; }
    .compose-wrap.unlocked { display: block; }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #333;
    }

    .empty-state .star { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.88rem; line-height: 1.6; }

    /* ── LOADING SPINNER ── */
    .generating-bar {
      text-align: center;
      font-size: 0.75rem;
      color: #555;
      padding: 10px;
      letter-spacing: 0.06em;
    }

    .star-spin {
      display: inline-block;
      animation: spin 1.5s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }


    .back-btn {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 999;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50%;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  text-decoration: none;
  backdrop-filter: blur(10px);
  transition: background 0.2s;
}

.back-btn:hover { background: rgba(255,255,255,0.12); }

.back-btn svg {
  width: 16px;
  height: 16px;
  stroke: #f0f0f0;
  fill: none;
  stroke-width: 2;
}
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-title">✦ Starpost</div>
    <div class="header-sub">Lily's private corner of the sky</div>
  </div>

  <!-- PASSWORD OVERLAY -->
  <div class="pw-overlay" id="pw-overlay">
    <div class="pw-lock">🌙</div>
    <div class="pw-title">✦ Starpost</div>
    <div class="pw-sub">Enter the password to post as Lily</div>
    <input class="pw-input" type="password" id="pw-input" placeholder="password" />
    <div class="pw-error" id="pw-error">Wrong password ✨</div>
    <button class="pw-btn" onclick="checkPassword()">Enter</button>
  </div>

  <!-- COMPOSE -->
  <div class="compose-wrap" id="compose-wrap">
    <div class="compose-box">
      <div class="compose-top">
        <div class="lily-avatar">
          <img src="avatars/lily.jpg" alt="Lily" onerror="this.parentElement.textContent='L'"/>
        </div>
        <textarea class="compose-input" id="compose-input" placeholder="What's on your mind, Lily..." maxlength="500"></textarea>
      </div>
      <div class="compose-bottom">
        <div class="char-count" id="char-count">0 / 500</div>
        <button class="post-btn" id="post-btn" onclick="submitPost()">Post ✦</button>
      </div>
    </div>
  </div>

  <!-- FEED -->
  <div class="feed" id="feed">
    <div class="empty-state" id="empty-state">
      <div class="star">✦</div>
      <p>No posts yet.<br>Write your first Starpost, Lily.</p>
    </div>
  </div>

  <script>
    var k1 = "gsk_5BRnFhDZ8P9hSdyFZEehWGdy";
    var k2 = "b3FY2U7nVhp8o5BsilfhNX26fZIP";
    var GROQ_API_KEY = k1 + k2;

    var characters = {
      Cloud: {
        color: "#a8d4f5",
        initial: "C",
        avatar: "avatars/cloud.jpg",
        system: "You are Cloud, a quiet and mysterious high school boy. You are Lily's childhood friend and care deeply about her. You leave short, thoughtful comments on her posts — gentle, kind, sometimes unexpectedly deep. You rarely use emojis. 1-2 sentences max. Stay in character always."
      },
      Sunny: {
        color: "#ffe566",
        initial: "S",
        avatar: "avatars/sunny.jpg",
        system: "You are Sunny, Lily's bubbly best friend. You leave enthusiastic, sweet comments on her posts — lots of exclamation marks and emojis, always supportive and excited. 1-3 sentences. Stay in character always."
      },
      Ava: {
        color: "#f5c5a3",
        initial: "A",
        avatar: "avatars/ava.jpg",
        system: "You are Ava, Lily's tomboy best friend. You leave casual, straightforward comments — sometimes a little sarcastic but always sweet and loyal. Keep it short and real. 1-2 sentences. Stay in character always."
      },
      Lynn: {
        color: "#e8e0d0",
        initial: "Ly",
        avatar: "avatars/lynn.jpg",
        system: "You are Lynn, a quiet girl who recently joined Lily's friend group. You are secretly obsessed with Lily and envious of her other friendships. You leave comments that seem normal but have a subtly unsettling undertone — overly attached or slightly off. 1-2 sentences. Stay in character always."
      }
    };

    var PASSWORD = "moonandstars";
    var unlocked = false;

    function checkPassword() {
      var val = document.getElementById('pw-input').value.trim();
      if (val === PASSWORD) {
        unlocked = true;
        document.getElementById('pw-overlay').style.display = 'none';
        document.getElementById('compose-wrap').classList.add('unlocked');
      } else {
        document.getElementById('pw-error').classList.add('show');
        document.getElementById('pw-input').value = '';
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !unlocked) checkPassword();
    });

        // Load posts from localStorage
    var posts = JSON.parse(localStorage.getItem('starpost_posts') || '[]');

    // Char counter
    document.getElementById('compose-input').addEventListener('input', function() {
      var len = this.value.length;
      var counter = document.getElementById('char-count');
      counter.textContent = len + ' / 500';
      counter.classList.toggle('warn', len > 450);
    });

    function formatDate(ts) {
      var d = new Date(ts);
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var h = d.getHours(); var m = d.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() + ' · ' + h + ':' + (m<10?'0'+m:m) + ' ' + ampm;
    }

    function timeAgo(ts) {
      var diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff/60) + 'm ago';
      if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
      return Math.floor(diff/86400) + 'd ago';
    }

    function savePosts() {
      localStorage.setItem('starpost_posts', JSON.stringify(posts));
    }

    function renderFeed() {
      var feed = document.getElementById('feed');
      feed.innerHTML = '';

      if (posts.length === 0) {
        feed.innerHTML = '<div class="empty-state" id="empty-state"><div class="star">✦</div><p>No posts yet.<br>Write your first Starpost, Lily.</p></div>';
        return;
      }

      // newest first
      var sorted = posts.slice().reverse();
      sorted.forEach(function(post) {
        feed.appendChild(buildPostCard(post));
      });
    }

    function buildPostCard(post) {
      var card = document.createElement('div');
      card.className = 'post-card';
      card.id = 'post-' + post.id;

      // Header
      var header = document.createElement('div');
      header.className = 'post-header';
      header.innerHTML =
        '<div class="post-avatar"><img src="avatars/lily.jpg" alt="Lily" onerror="this.parentElement.textContent=\'L\'"/></div>' +
        '<div><div class="post-username">Lily</div><div class="post-time">' + timeAgo(post.ts) + '</div></div>';
      card.appendChild(header);

      // Body
      var body = document.createElement('div');
      body.className = 'post-body';
      body.textContent = post.text;
      card.appendChild(body);

      // Actions
      var actions = document.createElement('div');
      actions.className = 'post-actions';

      var likeBtn = document.createElement('button');
      likeBtn.className = 'like-btn' + (post.liked ? ' liked' : '');
      likeBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span>' + post.likes + '</span>';
      likeBtn.onclick = function() { toggleLike(post.id, likeBtn); };

      var commentCount = document.createElement('div');
      commentCount.className = 'comment-count';
      commentCount.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>' + (post.comments ? post.comments.length : 0) + '</span>';

      var dateEl = document.createElement('div');
      dateEl.className = 'post-date-full';
      dateEl.textContent = formatDate(post.ts);

      actions.appendChild(likeBtn);
      actions.appendChild(commentCount);
      actions.appendChild(dateEl);
      card.appendChild(actions);

      // Comments
      var commentsSection = document.createElement('div');
      commentsSection.className = 'comments-section';
      commentsSection.id = 'comments-' + post.id;

      if (post.comments && post.comments.length > 0) {
        post.comments.forEach(function(c) {
          commentsSection.appendChild(buildComment(c));
        });
      }

      card.appendChild(commentsSection);
      return card;
    }

    function buildComment(c) {
      var char = characters[c.author];
      var item = document.createElement('div');
      item.className = 'comment-item';

      var av = document.createElement('div');
      av.className = 'comment-avatar';
      av.style.background = char.color;
      av.innerHTML = '<img src="' + char.avatar + '" alt="' + c.author + '" onerror="this.parentElement.innerHTML=\'' + char.initial + '\'"/>';

      var body = document.createElement('div');
      body.className = 'comment-body';
      body.innerHTML =
        '<div class="comment-name" style="color:' + char.color + '">' + c.author + '</div>' +
        '<div class="comment-text">' + c.text + '</div>';

      item.appendChild(av);
      item.appendChild(body);
      return item;
    }

    function showTypingComment(postId, sender) {
      var section = document.getElementById('comments-' + postId);
      var char = characters[sender];

      var typing = document.createElement('div');
      typing.className = 'comment-typing';
      typing.id = 'typing-' + postId + '-' + sender;

      var av = document.createElement('div');
      av.className = 'comment-avatar';
      av.style.background = char.color;
      av.innerHTML = '<img src="' + char.avatar + '" alt="' + sender + '" onerror="this.parentElement.innerHTML=\'' + char.initial + '\'"/>';

      var name = document.createElement('div');
      name.style.cssText = 'font-size:0.75rem;font-weight:700;color:' + char.color + ';margin-right:8px;';
      name.textContent = sender;

      var dots = document.createElement('div');
      dots.className = 'typing-dots';
      dots.innerHTML = '<span></span><span></span><span></span>';

      typing.appendChild(av);
      typing.appendChild(name);
      typing.appendChild(dots);
      section.appendChild(typing);

      // scroll
      typing.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function removeTypingComment(postId, sender) {
      var el = document.getElementById('typing-' + postId + '-' + sender);
      if (el) el.remove();
    }

    function toggleLike(postId, btn) {
      var post = posts.find(function(p){ return p.id === postId; });
      if (!post) return;
      post.liked = !post.liked;
      post.likes = post.liked ? post.likes + 1 : post.likes - 1;
      savePosts();
      btn.className = 'like-btn' + (post.liked ? ' liked' : '');
      btn.querySelector('span').textContent = post.likes;
    }

    async function getComment(sender, postText) {
      var char = characters[sender];
      var body = {
        model: "meta-llama/llama-4-scout-17b-16e-instruct",
        messages: [
          { role: "system", content: char.system },
          { role: "user", content: 'Lily just posted: "' + postText + '"\n\nLeave a short comment on her post, in character.' }
        ],
        max_tokens: 100,
        temperature: 0.92
      };

      var res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + GROQ_API_KEY },
        body: JSON.stringify(body)
      });

      var data = await res.json();
      return data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content.trim()
        : "...";
    }

    async function generateComments(post) {
      // Pick 2 or 3 random commenters
      var all = ["Cloud", "Sunny", "Ava", "Lynn"];
      var shuffled = all.sort(function(){ return Math.random() - 0.5; });
      var count = Math.random() < 0.5 ? 2 : 3;
      var chosen = shuffled.slice(0, count);

      for (var i = 0; i < chosen.length; i++) {
        var sender = chosen[i];

        // Random delay between comments (feels natural)
        var delay = i === 0 ? 1000 + Math.random() * 1000 : 1500 + Math.random() * 2000;
        await new Promise(function(r){ setTimeout(r, delay); });

        showTypingComment(post.id, sender);

        var typingDelay = 1200 + Math.random() * 1200;
        await new Promise(function(r){ setTimeout(r, typingDelay); });

        try {
          var text = await getComment(sender, post.text);
          removeTypingComment(post.id, sender);

          var comment = { author: sender, text: text };
          post.comments.push(comment);
          savePosts();

          // Add comment to DOM
          var section = document.getElementById('comments-' + post.id);
          if (section) {
            var commentEl = buildComment(comment);
            section.appendChild(commentEl);
            commentEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }

          // Update comment count
          var card = document.getElementById('post-' + post.id);
          if (card) {
            var countEl = card.querySelector('.comment-count span');
            if (countEl) countEl.textContent = post.comments.length;
          }

        } catch(e) {
          removeTypingComment(post.id, sender);
        }
      }
    }

    async function submitPost() {
      var input = document.getElementById('compose-input');
      var text = input.value.trim();
      if (!text) return;

      var btn = document.getElementById('post-btn');
      btn.disabled = true;
      btn.textContent = '✦ Posting...';

      var post = {
        id: Date.now(),
        text: text,
        ts: Date.now(),
        likes: Math.floor(Math.random() * 8) + 1, // small random starting likes
        liked: false,
        comments: []
      };

      posts.push(post);
      savePosts();

      input.value = '';
      document.getElementById('char-count').textContent = '0 / 500';
      btn.disabled = false;
      btn.textContent = 'Post ✦';

      renderFeed();

      // Generate comments async
      generateComments(post);
    }

    // Initial render
    renderFeed();
  </script>
