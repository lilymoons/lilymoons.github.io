<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#060812" />
  <title>Lily's Notes ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060812;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: #c8cbdf;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #0a0d1a;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 14px 22px 8px;
      font-size: 12px;
      color: #8891b8;
      font-weight: 500;
      flex-shrink: 0;
    }

    /* ── Header ── */
    .header-area {
      padding: 8px 22px 14px;
      border-bottom: 1px solid #141830;
      flex-shrink: 0;
    }
    .back-link {
      font-size: 12px; color: #5c6494;
      text-decoration: none; display: inline-flex;
      align-items: center; gap: 4px; margin-bottom: 10px;
    }
    .back-link:hover { color: #7b83c9; }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px; color: #e8eaf6; margin-bottom: 3px;
    }
    .page-title span { color: #7b83c9; }
    .page-sub { font-size: 11px; color: #4a5280; letter-spacing: 0.07em; text-transform: uppercase; }

    /* ── Subject tabs ── */
    .tabs-wrap {
      display: flex;
      gap: 8px;
      padding: 14px 14px 0;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .tabs-wrap::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid #1a1f3a;
      background: #0e1123;
      color: #3d4268;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab.active {
      background: #161b38;
      border-color: #2e3668;
      color: #9ba3cc;
    }
    .tab:hover { color: #7b83c9; border-color: #262d52; }

    /* ── Notes list ── */
    .notes-list {
      flex: 1;
      padding: 14px 14px 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .note-card {
      background: #0e1123;
      border: 1px solid #1a1f3a;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .note-card:hover { border-color: #2e3668; }
    .note-card-accent {
      height: 3px;
      width: 100%;
    }
    .note-card-body {
      padding: 12px 14px 10px;
    }
    .note-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .note-title {
      font-size: 13px;
      font-weight: 500;
      color: #c8cbdf;
    }
    .note-date {
      font-size: 10px;
      color: #2e3357;
    }
    .note-preview {
      font-size: 12px;
      color: #4a5280;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .note-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .note-sticker-preview {
      font-size: 14px;
    }
    .note-has-img {
      font-size: 10px;
      color: #3d4268;
      background: #111528;
      padding: 2px 7px;
      border-radius: 8px;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #2e3357;
      font-size: 13px;
      line-height: 1.8;
    }
    .empty-star { font-size: 28px; margin-bottom: 10px; display: block; }

    /* ── FAB (add note) ── */
    .fab {
      position: sticky;
      bottom: 80px;
      align-self: flex-end;
      margin: 12px 14px 0;
      width: 46px; height: 46px;
      background: #1e2548;
      border: 1px solid #2e3668;
      border-radius: 50%;
      font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .fab:hover { background: #262d52; }

    /* ── Bottom Nav ── */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 14px 10px 28px;
      border-top: 1px solid #111528;
      background: #0a0d1a;
      flex-shrink: 0;
    }
    .nav-item {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      font-size: 10px; color: #2e3357;
      text-decoration: none; padding: 4px 14px;
      transition: color 0.15s;
    }
    .nav-item.active { color: #7b83c9; }
    .nav-item:hover { color: #5c6494; }
    .nav-icon { font-size: 20px; }

    /* ══════════════════════════════════════
       EDITOR OVERLAY
    ══════════════════════════════════════ */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(6,8,18,0.92);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }
    .overlay.open { display: flex; }
    .editor {
      width: 100%;
      max-width: 390px;
      height: 93vh;
      background: #0a0d1a;
      border-radius: 24px 24px 0 0;
      border-top: 1px solid #1a1f3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.22s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }
    .editor-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #141830;
      flex-shrink: 0;
    }
    .editor-bar-left {
      display: flex; align-items: center; gap: 10px;
    }
    .editor-cancel {
      font-size: 12px; color: #5c6494;
      cursor: pointer; padding: 4px 8px;
      background: none; border: none; font-family: inherit;
    }
    .editor-cancel:hover { color: #7b83c9; }
    .editor-save {
      font-size: 12px; font-weight: 500;
      color: #e8eaf6; background: #1e2548;
      border: 1px solid #2e3668;
      border-radius: 10px;
      padding: 5px 14px; cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .editor-save:hover { background: #262d52; }
    .subject-select {
      font-size: 12px; color: #9ba3cc;
      background: #111528; border: 1px solid #1a1f3a;
      border-radius: 10px; padding: 4px 10px;
      font-family: inherit; cursor: pointer;
      appearance: none; -webkit-appearance: none;
    }
    .subject-select option { background: #111528; }
    .editor-title-input {
      width: 100%; background: none;
      border: none; outline: none;
      font-family: 'Playfair Display', serif;
      font-size: 20px; color: #e8eaf6;
      padding: 12px 16px 8px;
      border-bottom: 1px solid #141830;
      flex-shrink: 0;
    }
    .editor-title-input::placeholder { color: #2e3357; }
    .editor-body-input {
      flex: 1; background: none;
      border: none; outline: none; resize: none;
      font-family: 'Caveat', cursive;
      font-size: 18px; color: #9ba3cc;
      padding: 14px 16px;
      line-height: 1.7;
    }
    .editor-body-input::placeholder { color: #2a2f52; }

    /* Toolbar */
    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-top: 1px solid #141830;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .editor-toolbar::-webkit-scrollbar { display: none; }
    .tool-btn {
      flex-shrink: 0;
      background: #0e1123;
      border: 1px solid #1a1f3a;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.12s;
      line-height: 1;
    }
    .tool-btn:hover { background: #141830; }
    .tool-btn.active-tool { background: #1e2548; border-color: #2e3668; }
    .tool-sep {
      width: 1px; height: 22px;
      background: #1a1f3a;
      flex-shrink: 0;
      margin: 0 2px;
    }

    /* Image preview inside note */
    .img-preview-wrap {
      padding: 0 16px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .img-thumb {
      position: relative;
      width: 72px; height: 72px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #1a1f3a;
    }
    .img-thumb img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .img-thumb-remove {
      position: absolute;
      top: 2px; right: 2px;
      background: rgba(6,8,18,0.8);
      border: none; border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 10px; color: #9ba3cc;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }

    /* Sticker picker */
    .sticker-panel {
      display: none;
      padding: 10px 14px;
      border-top: 1px solid #141830;
      flex-wrap: wrap;
      gap: 8px;
      background: #0a0d1a;
      flex-shrink: 0;
    }
    .sticker-panel.open { display: flex; }
    .sticker-btn {
      font-size: 24px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: background 0.1s;
      background: none;
    }
    .sticker-btn:hover { background: #0e1123; border-color: #1a1f3a; }

    /* Stickers on editor */
    .sticker-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 16px 8px;
      min-height: 0;
    }
    .placed-sticker {
      font-size: 26px;
      cursor: pointer;
      position: relative;
    }
    .placed-sticker:hover::after {
      content: '×';
      position: absolute;
      top: -4px; right: -6px;
      font-size: 11px;
      background: #1e2548;
      border-radius: 50%;
      width: 14px; height: 14px;
      display: flex; align-items: center; justify-content: center;
      color: #9ba3cc;
      line-height: 14px;
      text-align: center;
    }

    /* Hidden file input */
    #img-file-input { display: none; }
  </style>
</head>
<body>

<div class="phone">

  <div class="status-bar">
    <span id="clock">9:41</span>
    <span>✦✦✦</span>
  </div>

  <div class="header-area">
    <a class="back-link" href="school.html">← School</a>
    <div class="page-title">My <span>Notes</span></div>
    <div class="page-sub">All subjects</div>
  </div>

  <div class="tabs-wrap" id="tabs-wrap">
    <div class="tab active" data-subject="All">All</div>
    <div class="tab" data-subject="Literature">📖 Literature</div>
    <div class="tab" data-subject="Mathematics">📐 Maths</div>
    <div class="tab" data-subject="Art & Design">🎨 Art</div>
    <div class="tab" data-subject="Photography">📸 Photo</div>
    <div class="tab" data-subject="History">🏛 History</div>
    <div class="tab" data-subject="Music">🎵 Music</div>
    <div class="tab" data-subject="Science">🔬 Science</div>
    <div class="tab" data-subject="Other">✦ Other</div>
  </div>

  <div class="notes-list" id="notes-list">
    <!-- notes rendered here -->
  </div>

  <div class="fab" id="fab-btn" title="New note">＋</div>

  <nav class="bottom-nav">
    <a class="nav-item" href="school.html"><div class="nav-icon">🏠</div><span>Home</span></a>
    <a class="nav-item active" href="notes.html"><div class="nav-icon">📓</div><span>Notes</span></a>
    <a class="nav-item" href="schedule.html"><div class="nav-icon">🗓</div><span>Schedule</span></a>
    <a class="nav-item" href="homework.html"><div class="nav-icon">📌</div><span>Tasks</span></a>
  </nav>

</div>

<!-- ══ EDITOR OVERLAY ══ -->
<div class="overlay" id="editor-overlay">
  <div class="editor">

    <div class="editor-bar">
      <div class="editor-bar-left">
        <button class="editor-cancel" id="editor-cancel">Cancel</button>
        <select class="subject-select" id="note-subject">
          <option>Literature</option>
          <option>Mathematics</option>
          <option>Art & Design</option>
          <option>Photography</option>
          <option>History</option>
          <option>Music</option>
          <option>Science</option>
          <option>Other</option>
        </select>
      </div>
      <button class="editor-save" id="editor-save">Save ✦</button>
    </div>

    <input class="editor-title-input" id="note-title" type="text" placeholder="Note title…" maxlength="60" />

    <div class="sticker-row" id="sticker-row"></div>
    <div class="img-preview-wrap" id="img-preview-wrap"></div>

    <textarea class="editor-body-input" id="note-body" placeholder="Write anything… ✦"></textarea>

    <div class="editor-toolbar">
      <button class="tool-btn" id="tool-stickers" title="Stickers">🌸</button>
      <button class="tool-btn" id="tool-img" title="Add image">🖼</button>
      <div class="tool-sep"></div>
      <button class="tool-btn" title="Star" onclick="insertText('⭐ ')">⭐</button>
      <button class="tool-btn" title="Moon" onclick="insertText('🌙 ')">🌙</button>
      <button class="tool-btn" title="Sparkle" onclick="insertText('✦ ')">✦</button>
      <button class="tool-btn" title="Heart" onclick="insertText('💜 ')">💜</button>
      <button class="tool-btn" title="Bullet" onclick="insertText('\n• ')">•</button>
      <button class="tool-btn" title="Check" onclick="insertText('\n☑ ')">☑</button>
      <button class="tool-btn" title="Arrow" onclick="insertText('→ ')">→</button>
    </div>

    <div class="sticker-panel" id="sticker-panel">
      <!-- sticker rows -->
    </div>

    <input type="file" id="img-file-input" accept="image/*" multiple />

  </div>
</div>

<script>
// ── Sticker library ──
const STICKERS = [
  '🌸','🌺','🌻','🌼','🌷','🪷','💐','🍀','🌿','🌱',
  '⭐','🌟','✨','💫','🌙','☀️','🌈','❄️','☁️','🌊',
  '🦋','🐝','🐱','🐰','🦊','🐼','🐨','🦄','🐉','🌸',
  '🍓','🍒','🍑','🍰','🧁','🍭','🍬','🧋','☕','🍵',
  '📚','✏️','🖊️','📌','📎','🗂️','💡','🔮','🪄','🎀',
  '💜','💙','💖','🤍','🖤','💛','🧡','❤️','💚','🩷',
];

// ── Subject accent colors ──
const SUBJECT_COLORS = {
  'Literature':  '#5c6fd4',
  'Mathematics': '#a07fc9',
  'Art & Design':'#5ba8a0',
  'Photography': '#c97fa0',
  'History':     '#7ba8c9',
  'Music':       '#c9a07f',
  'Science':     '#7fc97f',
  'Other':       '#7b83c9',
};

// ── State ──
let notes = JSON.parse(localStorage.getItem('lily_notes') || '[]');
let editingId = null;
let currentImages = []; // base64 or url strings
let currentStickers = [];
let activeSubject = 'All';

// ── Render notes list ──
function renderNotes() {
  const list = document.getElementById('notes-list');
  const filtered = activeSubject === 'All'
    ? notes
    : notes.filter(n => n.subject === activeSubject);

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <span class="empty-star">✦</span>
      No notes yet${activeSubject !== 'All' ? ' for ' + activeSubject : ''}.<br>
      Tap <strong>＋</strong> to write your first one!
    </div>`;
    return;
  }

  list.innerHTML = filtered.slice().reverse().map(note => {
    const color = SUBJECT_COLORS[note.subject] || '#7b83c9';
    const stickersHtml = (note.stickers || []).slice(0,5).map(s => `<span class="note-sticker-preview">${s}</span>`).join('');
    const imgBadge = note.images && note.images.length ? `<span class="note-has-img">🖼 ${note.images.length}</span>` : '';
    return `
      <div class="note-card" onclick="openEdit('${note.id}')">
        <div class="note-card-accent" style="background:${color};"></div>
        <div class="note-card-body">
          <div class="note-top">
            <div class="note-title">${escHtml(note.title || 'Untitled')}</div>
            <div class="note-date">${note.date || ''}</div>
          </div>
          <div class="note-preview">${escHtml(note.body || '')}</div>
          <div class="note-footer">${stickersHtml}${imgBadge}
            <span style="font-size:10px;color:#2e3357;margin-left:auto;">${note.subject}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

// ── Tabs ──
document.getElementById('tabs-wrap').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeSubject = tab.dataset.subject;
  renderNotes();
});

// ── Open new note ──
document.getElementById('fab-btn').addEventListener('click', () => openEditor(null));

function openEditor(note) {
  editingId = note ? note.id : null;
  currentImages = note ? (note.images || []) : [];
  currentStickers = note ? (note.stickers || []) : [];
  document.getElementById('note-title').value = note ? note.title : '';
  document.getElementById('note-body').value = note ? note.body : '';
  document.getElementById('note-subject').value = note ? note.subject : 'Literature';
  renderStickerRow();
  renderImgPreviews();
  document.getElementById('editor-overlay').classList.add('open');
  document.getElementById('note-title').focus();
}

function openEdit(id) {
  const note = notes.find(n => n.id === id);
  if (note) openEditor(note);
}

// ── Close editor ──
document.getElementById('editor-cancel').addEventListener('click', closeEditor);
function closeEditor() {
  document.getElementById('editor-overlay').classList.remove('open');
  document.getElementById('sticker-panel').classList.remove('open');
  document.getElementById('tool-stickers').classList.remove('active-tool');
}

// ── Save note ──
document.getElementById('editor-save').addEventListener('click', () => {
  const title = document.getElementById('note-title').value.trim();
  const body  = document.getElementById('note-body').value.trim();
  const subject = document.getElementById('note-subject').value;
  if (!title && !body) { closeEditor(); return; }

  const today = new Date();
  const dateStr = today.toLocaleDateString('en-GB', { day:'numeric', month:'short' });

  if (editingId) {
    const idx = notes.findIndex(n => n.id === editingId);
    if (idx > -1) {
      notes[idx] = { ...notes[idx], title, body, subject, images: currentImages, stickers: currentStickers };
    }
  } else {
    notes.push({
      id: Date.now().toString(),
      title, body, subject,
      images: [...currentImages],
      stickers: [...currentStickers],
      date: dateStr,
    });
  }
  localStorage.setItem('lily_notes', JSON.stringify(notes));
  closeEditor();
  renderNotes();
});

// ── Sticker panel ──
const STICKER_PANEL = document.getElementById('sticker-panel');
const stickersHTML = STICKERS.map(s =>
  `<button class="sticker-btn" onclick="addSticker('${s}')">${s}</button>`
).join('');
STICKER_PANEL.innerHTML = stickersHTML;

document.getElementById('tool-stickers').addEventListener('click', () => {
  STICKER_PANEL.classList.toggle('open');
  document.getElementById('tool-stickers').classList.toggle('active-tool');
});

function addSticker(s) {
  currentStickers.push(s);
  renderStickerRow();
}
function renderStickerRow() {
  const row = document.getElementById('sticker-row');
  row.innerHTML = currentStickers.map((s, i) =>
    `<span class="placed-sticker" onclick="removeSticker(${i})" title="tap to remove">${s}</span>`
  ).join('');
}
function removeSticker(i) {
  currentStickers.splice(i, 1);
  renderStickerRow();
}

// ── Image upload ──
document.getElementById('tool-img').addEventListener('click', () => {
  document.getElementById('img-file-input').click();
});
document.getElementById('img-file-input').addEventListener('change', e => {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      currentImages.push(ev.target.result);
      renderImgPreviews();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});
function renderImgPreviews() {
  const wrap = document.getElementById('img-preview-wrap');
  wrap.innerHTML = currentImages.map((src, i) => `
    <div class="img-thumb">
      <img src="${src}" alt="note image" />
      <button class="img-thumb-remove" onclick="removeImg(${i})">×</button>
    </div>`).join('');
}
function removeImg(i) {
  currentImages.splice(i, 1);
  renderImgPreviews();
}

// ── Insert text at cursor ──
function insertText(txt) {
  const ta = document.getElementById('note-body');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  ta.value = ta.value.slice(0, start) + txt + ta.value.slice(end);
  ta.selectionStart = ta.selectionEnd = start + txt.length;
  ta.focus();
}

// ── Utilities ──
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function updateClock() {
  const d = new Date();
  document.getElementById('clock').textContent =
    d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
updateClock();
setInterval(updateClock, 60000);

// ── Close overlay on outside tap ──
document.getElementById('editor-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('editor-overlay')) closeEditor();
});

// ── Init ──
renderNotes();
</script>
</body>
</html>
