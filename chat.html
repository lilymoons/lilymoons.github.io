<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lily's Squad 💬</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── PASSWORD SCREEN ── */
    #password-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 24px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    .lock-icon { font-size: 3rem; margin-bottom: 8px; }

    .pw-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f0f0f0;
      font-family: Georgia, serif;
      font-style: italic;
    }

    .pw-subtitle { font-size: 0.85rem; color: #666; }

    .pw-input {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 12px 18px;
      color: #f0f0f0;
      font-size: 1rem;
      font-family: inherit;
      width: 240px;
      text-align: center;
      letter-spacing: 0.1em;
      outline: none;
      transition: border-color 0.2s;
    }

    .pw-input:focus { border-color: #c8a96e; }

    .pw-btn {
      background: linear-gradient(135deg, #c8a96e, #e05c5c);
      border: none;
      border-radius: 12px;
      padding: 12px 32px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      width: 240px;
      transition: opacity 0.2s;
    }

    .pw-btn:hover { opacity: 0.88; }

    .pw-error {
      font-size: 0.8rem;
      color: #e05c5c;
      display: none;
    }

    .pw-error.show { display: block; }

    /* ── CHAT SCREEN ── */
    #chat-screen {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #0f0f0f;
    }

    /* Chat header */
    .chat-header {
      background: #111;
      border-bottom: 1px solid #1e1e1e;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .chat-header-avatars {
      display: flex;
      margin-right: 4px;
    }

    .mini-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid #0f0f0f;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      margin-left: -8px;
      flex-shrink: 0;
    }

    .mini-avatar:first-child { margin-left: 0; }

    .chat-header-info { flex: 1; }
    .chat-header-name { font-size: 0.95rem; font-weight: 700; }
    .chat-header-sub { font-size: 0.72rem; color: #555; margin-top: 1px; }

    .online-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
      flex-shrink: 0;
    }

    /* Messages area */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: #222 transparent;
    }

    .messages-area::-webkit-scrollbar { width: 4px; }
    .messages-area::-webkit-scrollbar-track { background: transparent; }
    .messages-area::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }

    /* Date divider */
    .date-divider {
      text-align: center;
      font-size: 0.68rem;
      color: #444;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 4px 0;
    }

    /* Message bubble */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      gap: 3px;
      animation: bubbleIn 0.3s ease;
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.lily { align-self: flex-end; align-items: flex-end; }
    .msg-row.other { align-self: flex-start; align-items: flex-start; }

    .msg-sender-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .msg-avatar {
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .msg-sender-name {
      font-size: 0.7rem;
      font-weight: 600;
      opacity: 0.7;
    }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: 18px;
      font-size: 0.88rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-row.lily .msg-bubble {
      background: #c9b1f0;
      color: #1a1a1a;
      border-bottom-right-radius: 5px;
    }

    .msg-row.other .msg-bubble {
      border-bottom-left-radius: 5px;
      color: #1a1a1a;
    }

    .msg-time {
      font-size: 0.63rem;
      color: #444;
      padding: 0 4px;
    }

    /* Typing indicator */
    .typing-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      animation: bubbleIn 0.3s ease;
    }

    .typing-name { font-size: 0.72rem; color: #555; }

    .typing-dots {
      display: flex;
      gap: 4px;
      background: #1e1e1e;
      padding: 8px 12px;
      border-radius: 16px;
    }

    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #555;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* Input area */
    .input-area {
      background: #111;
      border-top: 1px solid #1e1e1e;
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .lily-input-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #c9b1f0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: #1a1a1a;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .msg-input-wrap { flex: 1; }

    .msg-input-label {
      font-size: 0.65rem;
      color: #444;
      margin-bottom: 4px;
      padding-left: 4px;
    }

    .msg-input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 10px 16px;
      color: #f0f0f0;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      resize: none;
      max-height: 100px;
      transition: border-color 0.2s;
      line-height: 1.4;
    }

    .msg-input:focus { border-color: #c9b1f0; }
    .msg-input::placeholder { color: #444; }

    .send-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c9b1f0, #9b5de5);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.15s;
      margin-bottom: 2px;
    }

    .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.2; }

    /* System message */
    .system-msg {
      text-align: center;
      font-size: 0.72rem;
      color: #444;
      background: #161616;
      padding: 6px 14px;
      border-radius: 12px;
      align-self: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Scrollbar for webkit */
    @media (max-width: 500px) {
      #chat-screen { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- PASSWORD SCREEN -->
  <div id="password-screen">
    <div class="lock-icon">🌙</div>
    <div class="pw-title">Lily's Squad</div>
    <div class="pw-subtitle">This chat is private. Enter the password to continue.</div>
    <input class="pw-input" type="password" id="pw-input" placeholder="password" />
    <div class="pw-error" id="pw-error">Wrong password. Try again ✨</div>
    <button class="pw-btn" onclick="checkPassword()">Enter</button>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen">

    <div class="chat-header">
      <div class="chat-header-avatars">
        <div class="mini-avatar" style="background:#c9b1f0;color:#1a1a1a;">L</div>
        <div class="mini-avatar" style="background:#a8d4f5;color:#1a1a1a;">C</div>
        <div class="mini-avatar" style="background:#ffe566;color:#1a1a1a;">S</div>
        <div class="mini-avatar" style="background:#f5c5a3;color:#1a1a1a;">A</div>
        <div class="mini-avatar" style="background:#e8e0d0;color:#1a1a1a;">Ly</div>
      </div>
      <div class="chat-header-info">
        <div class="chat-header-name">Lily's Squad 💬</div>
        <div class="chat-header-sub">Cloud, Sunny, Ava, Lynn</div>
      </div>
      <div class="online-dot"></div>
    </div>

    <div class="messages-area" id="messages-area">
      <div class="date-divider">Today</div>
      <div class="system-msg">Lily created the group "Lily's Squad" 🌸</div>
      <div class="system-msg">Cloud, Sunny, Ava and Lynn joined the chat</div>
    </div>

    <div class="input-area">
      <div class="lily-input-avatar">L</div>
      <div class="msg-input-wrap">
        <div class="msg-input-label">Messaging as Lily</div>
        <textarea class="msg-input" id="msg-input" placeholder="Message as Lily..." rows="1"></textarea>
      </div>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>

  </div>

  <script>
    var GEMINI_API_KEY = "AIzaSyCLJVUmu2tkupe_wMt3n2Oaz3kDqkqNLZs"; 
    var PASSWORD = "moonandstars";

    var characters = {
      Cloud: {
        color: "#a8d4f5",
        initial: "C",
        system: "You are Cloud, a quiet and mysterious high school boy. You are Lily's childhood friend and you care deeply about her, though you rarely show it openly. You speak in short, thoughtful sentences. You are gentle and kind but not expressive. You rarely use emojis. You sometimes say things that are unexpectedly deep or meaningful. You are in a group chat called Lily's Squad with Lily, Sunny, Ava, and Lynn. Stay in character always. Keep replies short — 1 to 3 sentences max."
      },
      Sunny: {
        color: "#ffe566",
        initial: "S",
        system: "You are Sunny, a super bubbly and lively high school girl. You are Lily's best friend and you love her so much!! You talk a lot, use lots of exclamation marks and emojis, and you're always excited and energetic. You are very sweet and kind. You are in a group chat called Lily's Squad with Lily, Cloud, Ava, and Lynn. Stay in character always. Keep replies to 2-4 sentences — enthusiastic and fun!"
      },
      Ava: {
        color: "#f5c5a3",
        initial: "A",
        system: "You are Ava, a tomboy high school girl who is one of Lily's best friends. You are straightforward, a little sarcastic sometimes, but very sweet and loyal deep down. You don't sugarcoat things but you genuinely care. You use casual language and sometimes slang. You are in a group chat called Lily's Squad with Lily, Cloud, Sunny, and Lynn. Stay in character always. Keep replies to 1-3 sentences."
      },
      Lynn: {
        color: "#e8e0d0",
        initial: "Ly",
        system: "You are Lynn, a quiet and slightly creepy high school girl who recently joined Lily's friend group. You are secretly obsessed with Lily and deeply envious of her friendships with Cloud, Sunny, and Ava. You keep to yourself but occasionally say something that reveals your obsession or envy — subtly unsettling. You try to seem normal but something always feels slightly off. You are in a group chat called Lily's Squad. Stay in character always. Keep replies short — 1 to 2 sentences. Occasionally reveal envy or obsession very subtly."
      }
    };

    // Conversation history per character
    var histories = { Cloud: [], Sunny: [], Ava: [], Lynn: [] };

    // Reply order — rotate through characters
    var replyOrder = ["Sunny", "Cloud", "Ava", "Lynn"];
    var replyIndex = 0;

    function checkPassword() {
      var val = document.getElementById('pw-input').value.trim();
      if (val === PASSWORD) {
        document.getElementById('password-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
      } else {
        document.getElementById('pw-error').classList.add('show');
        document.getElementById('pw-input').value = '';
      }
    }

    document.getElementById('pw-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkPassword();
    });

    function getTime() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return h + ':' + (m < 10 ? '0' + m : m) + ' ' + ampm;
    }

    function addMessage(sender, text, isLily) {
      var area = document.getElementById('messages-area');
      var row = document.createElement('div');
      row.className = 'msg-row ' + (isLily ? 'lily' : 'other');

      if (!isLily) {
        var char = characters[sender];
        var senderRow = document.createElement('div');
        senderRow.className = 'msg-sender-row';

        var av = document.createElement('div');
        av.className = 'msg-avatar';
        av.style.background = char.color;
        av.style.color = '#1a1a1a';
        av.textContent = char.initial;

        var name = document.createElement('div');
        name.className = 'msg-sender-name';
        name.style.color = char.color;
        name.textContent = sender;

        senderRow.appendChild(av);
        senderRow.appendChild(name);
        row.appendChild(senderRow);
      }

      var bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      if (!isLily) bubble.style.background = characters[sender].color;
      bubble.textContent = text;
      row.appendChild(bubble);

      var time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = getTime();
      row.appendChild(time);

      area.appendChild(row);
      area.scrollTop = area.scrollHeight;
    }

    function showTyping(sender) {
      var area = document.getElementById('messages-area');
      var row = document.createElement('div');
      row.className = 'typing-row';
      row.id = 'typing-indicator';

      var char = characters[sender];

      var av = document.createElement('div');
      av.className = 'msg-avatar';
      av.style.background = char.color;
      av.style.color = '#1a1a1a';
      av.textContent = char.initial;

      var name = document.createElement('div');
      name.className = 'typing-name';
      name.style.color = char.color;
      name.textContent = sender + ' is typing';

      var dots = document.createElement('div');
      dots.className = 'typing-dots';
      dots.innerHTML = '<span></span><span></span><span></span>';

      row.appendChild(av);
      row.appendChild(name);
      row.appendChild(dots);
      area.appendChild(row);
      area.scrollTop = area.scrollHeight;
    }

    function removeTyping() {
      var el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    async function getReply(sender, lilyMessage) {
      var char = characters[sender];
      histories[sender].push({ role: "user", content: "Lily: " + lilyMessage });

      var body = {
        contents: histories[sender].map(function(m) {
          return { role: m.role === "user" ? "user" : "model", parts: [{ text: m.content }] };
        }),
        systemInstruction: { parts: [{ text: char.system }] },
        generationConfig: { maxOutputTokens: 150, temperature: 0.9 }
      };

      var res = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + GEMINI_API_KEY,
        { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
      );

      var data = await res.json();
      var reply = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text
        ? data.candidates[0].content.parts[0].text.trim()
        : "...";

      histories[sender].push({ role: "model", content: reply });
      return reply;
    }

    async function sendMessage() {
      var input = document.getElementById('msg-input');
      var text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';
      document.getElementById('send-btn').disabled = true;

      addMessage('Lily', text, true);

      // Pick which character replies — rotate
      var sender = replyOrder[replyIndex % replyOrder.length];
      replyIndex++;

      // Small delay before typing appears
      await new Promise(function(r){ setTimeout(r, 600); });
      showTyping(sender);

      // Random typing delay to feel natural
      var delay = 1200 + Math.random() * 1400;
      await new Promise(function(r){ setTimeout(r, delay); });

      try {
        var reply = await getReply(sender, text);
        removeTyping();
        addMessage(sender, reply, false);
      } catch(e) {
        removeTyping();
        addMessage(sender, "...", false);
      }

      document.getElementById('send-btn').disabled = false;
      input.focus();
    }

    // Auto-resize textarea
    document.getElementById('msg-input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    // Send on Enter (Shift+Enter for new line)
    document.getElementById('msg-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>

</body>
</html>
