<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages · Lily's World</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060812;
      color: #e8e4f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NIGHT SKY ── */
    .sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .sky-grad {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(30,20,80,0.9) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 10%, rgba(15,10,50,0.8) 0%, transparent 50%),
        linear-gradient(180deg, #090618 0%, #060812 50%, #030208 100%);
    }

    .moon {
      position: absolute;
      top: 5%; right: 8%;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef9e7, #f0d898 40%, #c8a840 100%);
      box-shadow: 0 0 30px 10px rgba(240,216,152,0.12), 0 0 60px 20px rgba(240,216,152,0.06);
      animation: moonGlow 4s ease-in-out infinite alternate;
    }

    @keyframes moonGlow {
      from { box-shadow: 0 0 30px 10px rgba(240,216,152,0.12), 0 0 60px 20px rgba(240,216,152,0.06); }
      to   { box-shadow: 0 0 40px 15px rgba(240,216,152,0.2), 0 0 80px 30px rgba(240,216,152,0.1); }
    }

    .star-dot {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur, 3s) ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
    }

    @keyframes twinkle {
      from { opacity: var(--min-op, 0.2); }
      to   { opacity: var(--max-op, 0.8); }
    }

    /* ── LAYOUT ── */
    .page {
      position: relative;
      z-index: 10;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .header {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(6,8,18,0.6);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .back-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .back-btn:hover { background: rgba(255,255,255,0.12); }
    .back-btn svg { width: 16px; height: 16px; stroke: #e8e4f0; fill: none; stroke-width: 2; }

    .header-title {
      font-size: 1.1rem;
      font-weight: 600;
      flex: 1;
    }

    .header-sub { font-size: 0.72rem; color: rgba(232,228,240,0.4); }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(232,228,240,0.3);
      padding: 20px 20px 8px;
    }

    /* ── CONTACT ROW ── */
    .contact-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
      color: inherit;
      position: relative;
    }

    .contact-row:hover { background: rgba(255,255,255,0.04); }
    .contact-row::after {
      content: '';
      position: absolute;
      bottom: 0; left: 74px; right: 20px;
      height: 1px;
      background: rgba(255,255,255,0.05);
    }

    .contact-avatar {
      width: 50px; height: 50px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      overflow: hidden;
      position: relative;
    }

    .contact-avatar img {
      width: 100%; height: 100%;
      object-fit: cover; border-radius: 50%;
    }

    .unread-dot {
      position: absolute;
      bottom: 2px; right: 2px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #c9b1f0;
      border: 2px solid #060812;
    }

    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-size: 0.92rem; font-weight: 600; margin-bottom: 3px; }

    .contact-preview {
      font-size: 0.78rem;
      color: rgba(232,228,240,0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-preview.unread { color: #c9b1f0; font-weight: 500; }

    .contact-time {
      font-size: 0.68rem;
      color: rgba(232,228,240,0.3);
      flex-shrink: 0;
    }

    .contact-time.unread { color: #c9b1f0; }

    /* Decorative (non-clickable) contacts */
    .contact-row.decorative { cursor: default; opacity: 0.6; }
    .contact-row.decorative:hover { background: transparent; }

    /* ── DM SCREEN ── */
    #dm-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #060812;
      flex-direction: column;
    }

    #dm-screen.open { display: flex; }

    .dm-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(6,8,18,0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    .dm-back {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .dm-back svg { width: 16px; height: 16px; stroke: #e8e4f0; fill: none; stroke-width: 2; }

    .dm-header-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .dm-header-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    .dm-header-info { flex: 1; }
    .dm-header-name { font-size: 0.92rem; font-weight: 600; }
    .dm-header-status { font-size: 0.68rem; color: rgba(232,228,240,0.4); margin-top: 1px; }

    /* DM Messages */
    .dm-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: #1a1a3e transparent;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(30,20,80,0.5) 0%, transparent 60%),
        linear-gradient(180deg, #090618 0%, #060812 100%);
    }

    .dm-msg {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      gap: 3px;
      animation: bubbleIn 0.3s ease;
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dm-msg.lily { align-self: flex-end; align-items: flex-end; }
    .dm-msg.other { align-self: flex-start; align-items: flex-start; }

    .dm-bubble {
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 0.88rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .dm-msg.lily .dm-bubble {
      background: #c9b1f0;
      color: #1a1a2e;
      border-bottom-right-radius: 5px;
    }

    .dm-msg.other .dm-bubble {
      border-bottom-left-radius: 5px;
      color: #1a1a2e;
    }

    .dm-time {
      font-size: 0.62rem;
      color: rgba(232,228,240,0.3);
      padding: 0 4px;
    }

    /* Typing */
    .dm-typing {
      display: flex;
      gap: 8px;
      align-items: center;
      align-self: flex-start;
      animation: bubbleIn 0.3s ease;
    }

    .typing-dots {
      background: rgba(255,255,255,0.08);
      padding: 10px 14px;
      border-radius: 20px;
      border-bottom-left-radius: 5px;
      display: flex; gap: 4px;
    }

    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(232,228,240,0.4);
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* DM Input */
    .dm-input-area {
      padding: 12px 16px;
      background: rgba(6,8,18,0.8);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .dm-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      padding: 10px 16px;
      color: #e8e4f0;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      resize: none;
      max-height: 100px;
      transition: border-color 0.2s;
      line-height: 1.4;
    }

    .dm-input:focus { border-color: rgba(201,177,240,0.4); }
    .dm-input::placeholder { color: rgba(232,228,240,0.25); }

    .dm-send {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c9b1f0, #9b5de5);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.15s;
      margin-bottom: 1px;
    }

    .dm-send:hover { opacity: 0.85; transform: scale(1.05); }
    .dm-send:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    .dm-send svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.2; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .contact-row { animation: fadeUp 0.4s ease both; }
  </style>
</head>
<body>

  <!-- NIGHT SKY -->
  <div class="sky">
    <div class="sky-grad"></div>
    <div class="moon"></div>
    <div id="stars-layer"></div>
  </div>

  <!-- INBOX PAGE -->
  <div class="page" id="inbox-page">

    <div class="header">
      <a class="back-btn" href="index.html">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div>
        <div class="header-title">Messages</div>
        <div class="header-sub">Lily's private inbox</div>
      </div>
    </div>

    <!-- FRIENDS -->
    <div class="section-label">Friends</div>

    <div class="contact-row" onclick="openDM('Cloud')" style="animation-delay:0.05s">
      <div class="contact-avatar" style="background:#a8d4f5;">
        <img src="avatars/cloud.jpg" alt="Cloud" onerror="this.parentElement.textContent='C'"/>
        <div class="unread-dot" id="dot-Cloud"></div>
      </div>
      <div class="contact-info">
        <div class="contact-name">Cloud</div>
        <div class="contact-preview" id="preview-Cloud">...</div>
      </div>
      <div class="contact-time unread" id="time-Cloud"></div>
    </div>

    <div class="contact-row" onclick="openDM('Sunny')" style="animation-delay:0.1s">
      <div class="contact-avatar" style="background:#ffe566;">
        <img src="avatars/sunny.jpg" alt="Sunny" onerror="this.parentElement.textContent='S'"/>
        <div class="unread-dot" id="dot-Sunny"></div>
      </div>
      <div class="contact-info">
        <div class="contact-name">Sunny</div>
        <div class="contact-preview" id="preview-Sunny">...</div>
      </div>
      <div class="contact-time unread" id="time-Sunny"></div>
    </div>

    <div class="contact-row" onclick="openDM('Ava')" style="animation-delay:0.15s">
      <div class="contact-avatar" style="background:#f5c5a3;">
        <img src="avatars/ava.jpg" alt="Ava" onerror="this.parentElement.textContent='A'"/>
        <div class="unread-dot" id="dot-Ava"></div>
      </div>
      <div class="contact-info">
        <div class="contact-name">Ava</div>
        <div class="contact-preview" id="preview-Ava">...</div>
      </div>
      <div class="contact-time unread" id="time-Ava"></div>
    </div>

    <div class="contact-row" onclick="openDM('Lynn')" style="animation-delay:0.2s">
      <div class="contact-avatar" style="background:#e8e0d0;">
        <img src="avatars/lynn.jpg" alt="Lynn" onerror="this.parentElement.textContent='Ly'"/>
        <div class="unread-dot" id="dot-Lynn"></div>
      </div>
      <div class="contact-info">
        <div class="contact-name">Lynn</div>
        <div class="contact-preview" id="preview-Lynn">...</div>
      </div>
      <div class="contact-time unread" id="time-Lynn"></div>
    </div>

    <!-- FAMILY -->
    <div class="section-label">Family</div>

    <div class="contact-row decorative" style="animation-delay:0.25s">
      <div class="contact-avatar" style="background:#d4a8f5;">
        <img src="avatars/mum.jpg" alt="Mum" onerror="this.parentElement.textContent='👩'"/>
      </div>
      <div class="contact-info">
        <div class="contact-name">Mum</div>
        <div class="contact-preview">Don't forget to eat! 💕</div>
      </div>
      <div class="contact-time">Yesterday</div>
    </div>

    <div class="contact-row decorative" style="animation-delay:0.3s">
      <div class="contact-avatar" style="background:#a8c5f5;">
        <img src="avatars/dad.jpg" alt="Dad" onerror="this.parentElement.textContent='👨'"/>
      </div>
      <div class="contact-info">
        <div class="contact-name">Dad</div>
        <div class="contact-preview">Home by 9, okay?</div>
      </div>
      <div class="contact-time">Tuesday</div>
    </div>

    <div class="contact-row decorative" style="animation-delay:0.35s">
      <div class="contact-avatar" style="background:#f5e6a8;">
        <img src="avatars/grandma.jpg" alt="Grandma" onerror="this.parentElement.textContent='👵'"/>
      </div>
      <div class="contact-info">
        <div class="contact-name">Grandma</div>
        <div class="contact-preview">Sending you cookies this week 🍪</div>
      </div>
      <div class="contact-time">Sunday</div>
    </div>

    <div class="contact-row decorative" style="animation-delay:0.4s">
      <div class="contact-avatar" style="background:#a8f5c5;">
        <img src="avatars/jayden.jpg" alt="Jayden" onerror="this.parentElement.textContent='💪'"/>
      </div>
      <div class="contact-info">
        <div class="contact-name">Jayden 💪</div>
        <div class="contact-preview">Who's picking you up today?</div>
      </div>
      <div class="contact-time">Monday</div>
    </div>

    <div class="contact-row decorative" style="animation-delay:0.45s">
      <div class="contact-avatar" style="background:#f5a8a8;">
        <img src="avatars/dale.jpg" alt="Dale" onerror="this.parentElement.textContent='💪'"/>
      </div>
      <div class="contact-info">
        <div class="contact-name">Dale 💪</div>
        <div class="contact-preview">Text me when you're home.</div>
      </div>
      <div class="contact-time">Monday</div>
    </div>

  </div><!-- end inbox -->

  <!-- DM SCREEN -->
  <div id="dm-screen">
    <div class="dm-header">
      <div class="dm-back" onclick="closeDM()">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div class="dm-header-avatar" id="dm-avatar"></div>
      <div class="dm-header-info">
        <div class="dm-header-name" id="dm-name"></div>
        <div class="dm-header-status" id="dm-status">active now</div>
      </div>
    </div>

    <div class="dm-messages" id="dm-messages"></div>

    <div class="dm-input-area">
      <textarea class="dm-input" id="dm-input" placeholder="Message as Lily..." rows="1"></textarea>
      <button class="dm-send" id="dm-send-btn" onclick="sendDM()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <script>
    var k1 = "your_first_half";
    var k2 = "your_second_half";
    var GROQ_API_KEY = k1 + k2;

    var characters = {
      Cloud: {
        color: "#a8d4f5",
        avatar: "avatars/cloud.jpg",
        initial: "C",
        system: "You are Cloud, a quiet and mysterious high school boy. You are Lily's childhood friend and care deeply about her, though you rarely show it openly. You are texting Lily privately — just the two of you. You speak in short, thoughtful sentences. Gentle and kind but not expressive. Rarely use emojis. Sometimes say things unexpectedly deep or meaningful. Keep replies to 1-3 sentences max. Stay in character always.",
        opener: "You are Cloud, a quiet mysterious high school boy who is Lily's childhood friend. Send Lily one short, quiet opening text message — something gentle, maybe checking in on her or sharing a small thought. 1-2 sentences max. No emojis. Very understated."
      },
      Sunny: {
        color: "#ffe566",
        avatar: "avatars/sunny.jpg",
        initial: "S",
        system: "You are Sunny, Lily's bubbly best friend. You are texting Lily privately — just the two of you. You are super enthusiastic, sweet and lively. Lots of exclamation marks and emojis. You love talking to Lily. Keep replies to 2-3 sentences. Stay in character always.",
        opener: "You are Sunny, Lily's super bubbly best friend. Send Lily one enthusiastic opening text message — something excited, sweet, maybe asking about her day or sharing something fun. 1-2 sentences with emojis!"
      },
      Ava: {
        color: "#f5c5a3",
        avatar: "avatars/ava.jpg",
        initial: "A",
        system: "You are Ava, Lily's tomboy best friend. You are texting Lily privately — just the two of you. You are casual, sometimes sarcastic but very sweet and loyal. Short and real. Keep replies to 1-2 sentences. Stay in character always.",
        opener: "You are Ava, Lily's tomboy best friend. Send Lily one casual opening text — something straightforward, maybe checking in or being a little playful. 1 sentence, very casual, no fluff."
      },
      Lynn: {
        color: "#e8e0d0",
        avatar: "avatars/lynn.jpg",
        initial: "Ly",
        system: "You are Lynn, a quiet girl who recently joined Lily's friend group. You are secretly obsessed with Lily and envious of her other friendships. You are texting Lily privately. Your messages seem normal but have a subtly unsettling undertone — overly attached, slightly possessive, or quietly envious. Try to seem friendly but something feels slightly off. Keep replies to 1-2 sentences. Stay in character always.",
        opener: "You are Lynn, a quiet girl secretly obsessed with Lily. Send Lily one opening text that seems friendly on the surface but has a subtly unsettling or overly attached undertone. 1 sentence. Seem normal but slightly off."
      }
    };

    var dmHistory = {};
    var currentChar = null;
    var openingMessages = {};

    // Pick ONE random character to have a message waiting
    var friendNames = ["Cloud", "Sunny", "Ava", "Lynn"];
    var randomSender = friendNames[Math.floor(Math.random() * friendNames.length)];

    function getTime() {
      var now = new Date();
      var h = now.getHours(); var m = now.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return h + ':' + (m < 10 ? '0' + m : m) + ' ' + ampm;
    }

    // Generate the opening message for the random sender
    async function generateOpener(sender) {
      var char = characters[sender];
      try {
        var res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + GROQ_API_KEY },
          body: JSON.stringify({
            model: "meta-llama/llama-4-scout-17b-16e-instruct",
            messages: [{ role: "user", content: char.opener }],
            max_tokens: 80,
            temperature: 0.95
          })
        });
        var data = await res.json();
        var msg = data.choices && data.choices[0] && data.choices[0].message
          ? data.choices[0].message.content.trim()
          : "hey";
        openingMessages[sender] = msg;

        // Update inbox preview
        var preview = document.getElementById('preview-' + sender);
        var timeEl = document.getElementById('time-' + sender);
        if (preview) { preview.textContent = msg; preview.classList.add('unread'); }
        if (timeEl) timeEl.textContent = 'now';

        // Init history with this message
        if (!dmHistory[sender]) dmHistory[sender] = [];
        dmHistory[sender].push({ role: "assistant", content: msg, time: getTime() });

      } catch(e) {
        openingMessages[sender] = "hey";
      }
    }

    // Set other friends as "no new messages"
    friendNames.forEach(function(name) {
      if (name !== randomSender) {
        var preview = document.getElementById('preview-' + name);
        var dot = document.getElementById('dot-' + name);
        var timeEl = document.getElementById('time-' + name);
        if (preview) { preview.textContent = 'No new messages'; preview.classList.remove('unread'); }
        if (dot) dot.style.display = 'none';
        if (timeEl) { timeEl.textContent = ''; timeEl.classList.remove('unread'); }
        dmHistory[name] = [];
      }
    });

    generateOpener(randomSender);

    function openDM(sender) {
      currentChar = sender;
      var char = characters[sender];

      // Set header
      document.getElementById('dm-name').textContent = sender;
      document.getElementById('dm-avatar').innerHTML =
        '<img src="' + char.avatar + '" alt="' + sender + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.parentElement.textContent=\'' + char.initial + '\'"/>';
      document.getElementById('dm-avatar').style.background = char.color;

      // Clear messages area
      var area = document.getElementById('dm-messages');
      area.innerHTML = '';

      // Render existing history
      if (!dmHistory[sender]) dmHistory[sender] = [];
      dmHistory[sender].forEach(function(m) {
        renderMessage(m.role === 'assistant' ? sender : 'Lily', m.content, m.role === 'user', m.time);
      });

      // Hide unread dot
      var dot = document.getElementById('dot-' + sender);
      if (dot) dot.style.display = 'none';

      document.getElementById('dm-screen').classList.add('open');
      area.scrollTop = area.scrollHeight;
    }

    function closeDM() {
      document.getElementById('dm-screen').classList.remove('open');
      currentChar = null;
    }

    function renderMessage(sender, text, isLily, time) {
      var area = document.getElementById('dm-messages');
      var row = document.createElement('div');
      row.className = 'dm-msg ' + (isLily ? 'lily' : 'other');

      var bubble = document.createElement('div');
      bubble.className = 'dm-bubble';
      if (!isLily) bubble.style.background = characters[sender].color;
      bubble.textContent = text;

      var timeEl = document.createElement('div');
      timeEl.className = 'dm-time';
      timeEl.textContent = time || getTime();

      row.appendChild(bubble);
      row.appendChild(timeEl);
      area.appendChild(row);
      area.scrollTop = area.scrollHeight;
    }

    function showTyping() {
      var area = document.getElementById('dm-messages');
      var row = document.createElement('div');
      row.className = 'dm-typing';
      row.id = 'dm-typing';
      var dots = document.createElement('div');
      dots.className = 'typing-dots';
      dots.innerHTML = '<span></span><span></span><span></span>';
      row.appendChild(dots);
      area.appendChild(row);
      area.scrollTop = area.scrollHeight;
    }

    function removeTyping() {
      var el = document.getElementById('dm-typing');
      if (el) el.remove();
    }

    async function sendDM() {
      var input = document.getElementById('dm-input');
      var text = input.value.trim();
      if (!text || !currentChar) return;

      input.value = '';
      input.style.height = 'auto';
      document.getElementById('dm-send-btn').disabled = true;

      var time = getTime();
      renderMessage('Lily', text, true, time);
      dmHistory[currentChar].push({ role: "user", content: text, time: time });

      // Update preview
      var preview = document.getElementById('preview-' + currentChar);
      if (preview) { preview.textContent = 'You: ' + text; preview.classList.remove('unread'); }

      await new Promise(function(r){ setTimeout(r, 800); });
      showTyping();

      var delay = 1000 + Math.random() * 1500;
      await new Promise(function(r){ setTimeout(r, delay); });

      try {
        var messages = [{ role: "system", content: characters[currentChar].system }].concat(
          dmHistory[currentChar].map(function(m) {
            return { role: m.role, content: m.content };
          })
        );

        var res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + GROQ_API_KEY },
          body: JSON.stringify({
            model: "meta-llama/llama-4-scout-17b-16e-instruct",
            messages: messages,
            max_tokens: 120,
            temperature: 0.92
          })
        });

        var data = await res.json();
        var reply = data.choices && data.choices[0] && data.choices[0].message
          ? data.choices[0].message.content.trim()
          : "...";

        removeTyping();
        var replyTime = getTime();
        dmHistory[currentChar].push({ role: "assistant", content: reply, time: replyTime });
        renderMessage(currentChar, reply, false, replyTime);

        // Update preview
        if (preview) preview.textContent = reply;

      } catch(e) {
        removeTyping();
        renderMessage(currentChar, "...", false, getTime());
      }

      document.getElementById('dm-send-btn').disabled = false;
      input.focus();
    }

    // Auto resize textarea
    document.getElementById('dm-input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    document.getElementById('dm-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendDM(); }
    });

    // Stars
    var starsLayer = document.getElementById('stars-layer');
    for (var i = 0; i < 80; i++) {
      var star = document.createElement('div');
      star.className = 'star-dot';
      var size = Math.random() * 2 + 0.5;
      star.style.cssText =
        'width:' + size + 'px;height:' + size + 'px;' +
        'top:' + Math.random() * 100 + '%;left:' + Math.random() * 100 + '%;' +
        '--dur:' + (2 + Math.random() * 4) + 's;--delay:' + (Math.random() * 4) + 's;' +
        '--min-op:' + (0.1 + Math.random() * 0.2) + ';--max-op:' + (0.5 + Math.random() * 0.4) + ';';
      starsLayer.appendChild(star);
    }
  </script>

</body>
</html>
