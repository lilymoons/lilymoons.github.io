<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halflight — reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="ember-field"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<div id="readerRoot">
  <div class="reader-bar">
    <a class="back-link" href="index.html" aria-label="Back to all episodes">&#8249;</a>
    <div class="reader-titles">
      <div class="series-name" id="seriesName">Halflight</div>
      <div class="ep-name" id="epName">Episode</div>
    </div>
    <select class="ep-select" id="epSelect" aria-label="Jump to episode"></select>
  </div>

  <div class="ep-header">
    <p class="eyebrow" id="epEyebrow">Episode</p>
    <h1 id="epTitle">Title</h1>
    <p class="ep-header-sub" id="epSubtitle"></p>
  </div>

  <div class="panels" id="panels"></div>

  <div class="ep-end">
    <p class="end-label" id="epEndTitle">End of episode</p>
    <p class="author-note">Thanks for reading. Halflight updates weekly — see you at the next dusk.</p>

    <div class="like-row">
      <button id="likeBtn" type="button">&#9825; <span id="likeCount">248</span></button>
      <button type="button">&#128172; 32</button>
      <button type="button">&#8599; Share</button>
    </div>

    <div class="next-block">
      <div id="nextBlock"></div>
      <div id="prevLink"></div>
    </div>
  </div>

  <div class="comments">
    <h3>Comments</h3>
    <div id="commentList"></div>
  </div>
</div>

<script src="js/scenes.js"></script>
<script src="js/data.js"></script>
<script src="js/chapter.js"></script>
<script>
  document.getElementById("likeBtn").addEventListener("click", function () {
    this.classList.toggle("active");
    const countEl = document.getElementById("likeCount");
    countEl.textContent = Number(countEl.textContent) + (this.classList.contains("active") ? 1 : -1);
  });
</script>
</body>
</html>
