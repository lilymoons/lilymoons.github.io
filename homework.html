<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#060812" />
  <title>Lily's Homework ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060812;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: #c8cbdf;
    }
    .phone {
      width: 100%; max-width: 390px;
      min-height: 100vh;
      background: #0a0d1a;
      display: flex; flex-direction: column;
    }

    /* Status bar */
    .status-bar {
      display: flex; justify-content: space-between;
      padding: 14px 22px 8px;
      font-size: 12px; color: #8891b8; font-weight: 500;
      flex-shrink: 0;
    }

    /* Header */
    .header-area {
      padding: 8px 22px 14px;
      border-bottom: 1px solid #141830;
      flex-shrink: 0;
    }
    .back-link {
      font-size: 12px; color: #5c6494;
      text-decoration: none; display: inline-flex;
      align-items: center; gap: 4px; margin-bottom: 10px;
    }
    .back-link:hover { color: #7b83c9; }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px; color: #e8eaf6; margin-bottom: 3px;
    }
    .page-title span { color: #5ba8a0; }
    .page-sub { font-size: 11px; color: #4a5280; letter-spacing: 0.07em; text-transform: uppercase; }

    /* Stats strip */
    .stats-strip {
      display: flex; gap: 8px;
      padding: 12px 14px 0;
      flex-shrink: 0;
    }
    .stat-card {
      flex: 1;
      background: #0e1123;
      border: 1px solid #1a1f3a;
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
    }
    .stat-num {
      font-size: 20px; font-weight: 500;
      color: #e8eaf6; display: block;
    }
    .stat-label {
      font-size: 10px; color: #3d4268;
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-top: 2px;
    }

    /* Filter tabs */
    .tabs-wrap {
      display: flex; gap: 8px;
      padding: 14px 14px 0;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .tab {
      flex-shrink: 0;
      padding: 6px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      border: 1px solid #1a1f3a;
      background: #0e1123; color: #3d4268;
      transition: all 0.15s; white-space: nowrap;
    }
    .tab.active {
      background: #161b38; border-color: #2e3668; color: #9ba3cc;
    }
    .tab:hover { color: #7b83c9; border-color: #262d52; }

    /* Section label */
    .section-label {
      font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; color: #353a60;
      padding: 16px 22px 8px;
      flex-shrink: 0;
    }

    /* Task list */
    .task-list {
      flex: 1; overflow-y: auto;
      padding: 0 14px 8px;
      display: flex; flex-direction: column; gap: 8px;
    }

    .task-card {
      background: #0e1123;
      border: 1px solid #1a1f3a;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex; gap: 10px; align-items: flex-start;
      cursor: pointer;
      transition: border-color 0.15s, opacity 0.2s;
      position: relative;
      overflow: hidden;
    }
    .task-card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
    }
    .task-card:hover { border-color: #262d52; }
    .task-card.done { opacity: 0.45; }
    .task-card.done .task-title { text-decoration: line-through; color: #3d4268; }

    /* urgency accent colors */
    .task-card.urgent::before  { background: #c97fa0; }
    .task-card.soon::before    { background: #c9a07f; }
    .task-card.later::before   { background: #5c6fd4; }
    .task-card.done-card::before { background: #3d4268; }

    .check-btn {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1.5px solid #2e3357;
      background: none; flex-shrink: 0;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      font-size: 12px; color: transparent;
      transition: all 0.15s; margin-top: 1px;
    }
    .task-card.done .check-btn {
      background: #1e2548; border-color: #2e3668; color: #7b83c9;
    }
    .check-btn:hover { border-color: #7b83c9; }

    .task-info { flex: 1; min-width: 0; }
    .task-title {
      font-size: 13px; font-weight: 500; color: #c8cbdf;
      margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .task-meta {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .task-subject {
      font-size: 10px; color: #3d4268;
    }
    .task-due {
      font-size: 10px; padding: 1px 7px;
      border-radius: 8px; font-weight: 500;
    }
    .task-due.urgent { background: #2a1020; color: #c97fa0; }
    .task-due.soon   { background: #201a10; color: #c9a07f; }
    .task-due.later  { background: #10122a; color: #7b83c9; }
    .task-due.done   { background: #111528; color: #3d4268; }
    .task-note {
      font-size: 11px; color: #3d4268; margin-top: 4px;
      line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .task-priority {
      font-size: 16px; flex-shrink: 0; margin-top: 1px;
    }

    .empty-state {
      text-align: center; padding: 40px 20px;
      color: #2e3357; font-size: 13px; line-height: 1.9;
    }
    .empty-star { font-size: 28px; margin-bottom: 8px; display: block; }

    /* FAB */
    .fab {
      position: sticky; bottom: 80px;
      align-self: flex-end; margin: 10px 14px 0;
      width: 46px; height: 46px;
      background: #1e2548; border: 1px solid #2e3668;
      border-radius: 50%; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: background 0.15s;
    }
    .fab:hover { background: #262d52; }

    /* Bottom nav */
    .bottom-nav {
      display: flex; justify-content: space-around;
      padding: 14px 10px 28px;
      border-top: 1px solid #111528;
      background: #0a0d1a; flex-shrink: 0;
    }
    .nav-item {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      font-size: 10px; color: #2e3357;
      text-decoration: none; padding: 4px 14px;
      transition: color 0.15s;
    }
    .nav-item.active { color: #7b83c9; }
    .nav-item:hover  { color: #5c6494; }
    .nav-icon { font-size: 20px; }

    /* ── Overlay ── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(6,8,18,0.92); z-index: 100;
      justify-content: center; align-items: flex-end;
    }
    .overlay.open { display: flex; }
    .edit-panel {
      width: 100%; max-width: 390px;
      background: #0a0d1a;
      border-radius: 24px 24px 0 0;
      border-top: 1px solid #1a1f3a;
      padding: 20px 20px 36px;
      animation: slideUp 0.22s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }
    .panel-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px; color: #e8eaf6; margin-bottom: 16px;
    }
    .field-row { margin-bottom: 12px; }
    .field-label {
      font-size: 10px; letter-spacing: 0.1em;
      text-transform: uppercase; color: #353a60; margin-bottom: 5px;
    }
    .field-input {
      width: 100%; background: #0e1123;
      border: 1px solid #1a1f3a; border-radius: 10px;
      padding: 9px 12px; font-size: 13px;
      color: #c8cbdf; font-family: inherit; outline: none;
      transition: border-color 0.15s;
    }
    .field-input:focus { border-color: #2e3668; }
    .field-input option { background: #0e1123; }
    textarea.field-input { resize: none; height: 70px; line-height: 1.5; }
    .priority-row {
      display: flex; gap: 8px;
    }
    .priority-btn {
      flex: 1; padding: 8px;
      border-radius: 10px;
      border: 1px solid #1a1f3a;
      background: #0e1123; cursor: pointer;
      font-size: 13px; color: #3d4268;
      font-family: inherit; text-align: center;
      transition: all 0.15s;
    }
    .priority-btn.selected { background: #161b38; border-color: #2e3668; color: #9ba3cc; }
    .panel-actions {
      display: flex; gap: 8px; margin-top: 16px;
    }
    .btn-save {
      flex: 1; background: #1e2548;
      border: 1px solid #2e3668; border-radius: 12px;
      padding: 10px; font-size: 13px; font-weight: 500;
      color: #e8eaf6; cursor: pointer; font-family: inherit;
      transition: background 0.15s;
    }
    .btn-save:hover { background: #262d52; }
    .btn-delete {
      background: #1a0e1a; border: 1px solid #3a1f3a;
      border-radius: 12px; padding: 10px 16px;
      font-size: 13px; color: #c97fa0;
      cursor: pointer; font-family: inherit;
      transition: background 0.15s;
    }
    .btn-delete:hover { background: #22102a; }
    .btn-cancel {
      background: none; border: 1px solid #1a1f3a;
      border-radius: 12px; padding: 10px 14px;
      font-size: 13px; color: #5c6494;
      cursor: pointer; font-family: inherit;
    }
    .btn-cancel:hover { border-color: #262d52; color: #7b83c9; }
  </style>
</head>
<body>
<div class="phone">

  <div class="status-bar">
    <span id="clock">9:41</span>
    <span>✦✦✦</span>
  </div>

  <div class="header-area">
    <a class="back-link" href="school.html">← School</a>
    <div class="page-title">Home<span>work</span></div>
    <div class="page-sub">Tasks & due dates</div>
  </div>

  <div class="stats-strip">
    <div class="stat-card">
      <span class="stat-num" id="stat-due">0</span>
      <div class="stat-label">Due soon</div>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="stat-pending">0</span>
      <div class="stat-label">Pending</div>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="stat-done">0</span>
      <div class="stat-label">Done ✦</div>
    </div>
  </div>

  <div class="tabs-wrap">
    <div class="tab active" data-filter="all">All</div>
    <div class="tab" data-filter="pending">Pending</div>
    <div class="tab" data-filter="done">Done</div>
    <div class="tab" data-filter="urgent">🔴 Urgent</div>
    <div class="tab" data-filter="soon">🟡 Soon</div>
  </div>

  <div class="section-label" id="section-label">All tasks</div>
  <div class="task-list" id="task-list"></div>

  <div class="fab" id="fab-btn">＋</div>

  <nav class="bottom-nav">
    <a class="nav-item" href="school.html"><div class="nav-icon">🏠</div><span>Home</span></a>
    <a class="nav-item" href="notes.html"><div class="nav-icon">📓</div><span>Notes</span></a>
    <a class="nav-item" href="schedule.html"><div class="nav-icon">🗓</div><span>Schedule</span></a>
    <a class="nav-item active" href="homework.html"><div class="nav-icon">📌</div><span>Tasks</span></a>
  </nav>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="edit-panel">
    <div class="panel-title" id="panel-title">New Task</div>

    <div class="field-row">
      <div class="field-label">Task</div>
      <input class="field-input" id="f-title" type="text" placeholder="e.g. Chapter 5 essay…" maxlength="80" />
    </div>
    <div class="field-row">
      <div class="field-label">Subject</div>
      <select class="field-input" id="f-subject">
        <option>Literature</option><option>Mathematics</option>
        <option>Art & Design</option><option>Photography</option>
        <option>History</option><option>Music</option>
        <option>Science</option><option>Other</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field-label">Due date</div>
      <input class="field-input" id="f-due" type="date" />
    </div>
    <div class="field-row">
      <div class="field-label">Priority</div>
      <div class="priority-row">
        <button class="priority-btn selected" data-p="🔴">🔴 Urgent</button>
        <button class="priority-btn" data-p="🟡">🟡 Soon</button>
        <button class="priority-btn" data-p="🔵">🔵 Later</button>
      </div>
    </div>
    <div class="field-row">
      <div class="field-label">Notes</div>
      <textarea class="field-input" id="f-note" placeholder="Any extra details… ✦"></textarea>
    </div>

    <div class="panel-actions">
      <button class="btn-save" id="btn-save">Save ✦</button>
      <button class="btn-delete" id="btn-delete">Remove</button>
      <button class="btn-cancel" id="btn-cancel">Cancel</button>
    </div>
  </div>
</div>

<script>
const SUBJECT_COLORS = {
  'Literature':  '#5c6fd4', 'Mathematics': '#a07fc9',
  'Art & Design':'#5ba8a0', 'Photography': '#c97fa0',
  'History':     '#7ba8c9', 'Music':       '#c9a07f',
  'Science':     '#7fc9b8', 'Other':       '#7b83c9',
};

let tasks = JSON.parse(localStorage.getItem('lily_hw') || '[]');
let filter = 'all';
let editingId = null;
let selectedPriority = '🔴';

function saveTasks() { localStorage.setItem('lily_hw', JSON.stringify(tasks)); }

// ── Clock ──
function updateClock() {
  const d = new Date();
  document.getElementById('clock').textContent =
    d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
updateClock(); setInterval(updateClock, 60000);

// ── Urgency helpers ──
function urgency(task) {
  if (task.done) return 'done';
  if (!task.due) return 'later';
  const diff = (new Date(task.due) - new Date()) / 86400000;
  if (diff < 0)   return 'urgent';
  if (diff <= 2)  return 'urgent';
  if (diff <= 6)  return 'soon';
  return 'later';
}
function dueLabel(task) {
  if (!task.due) return null;
  const diff = Math.ceil((new Date(task.due) - new Date()) / 86400000);
  if (diff < 0)  return 'Overdue!';
  if (diff === 0) return 'Today!';
  if (diff === 1) return 'Tomorrow';
  return 'In ' + diff + 'd';
}

// ── Stats ──
function renderStats() {
  const pending  = tasks.filter(t => !t.done).length;
  const done     = tasks.filter(t => t.done).length;
  const dueSoon  = tasks.filter(t => !t.done && urgency(t) === 'urgent').length;
  document.getElementById('stat-due').textContent     = dueSoon;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-done').textContent    = done;
}

// ── Render ──
function getFiltered() {
  switch (filter) {
    case 'pending': return tasks.filter(t => !t.done);
    case 'done':    return tasks.filter(t => t.done);
    case 'urgent':  return tasks.filter(t => !t.done && urgency(t) === 'urgent');
    case 'soon':    return tasks.filter(t => !t.done && urgency(t) === 'soon');
    default:        return tasks;
  }
}

function renderTasks() {
  renderStats();
  const list = document.getElementById('task-list');
  const filtered = getFiltered().slice().sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const order = { urgent: 0, soon: 1, later: 2, done: 3 };
    return order[urgency(a)] - order[urgency(b)];
  });

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <span class="empty-star">✦</span>
      ${filter === 'done' ? 'Nothing done yet — you got this!' :
        filter === 'urgent' ? 'No urgent tasks right now ✦' :
        'No tasks yet. Tap ＋ to add one!'}
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(t => {
    const u = urgency(t);
    const dl = dueLabel(t);
    const subColor = SUBJECT_COLORS[t.subject] || '#7b83c9';
    return `
      <div class="task-card ${u}${t.done ? ' done done-card' : ''}" onclick="openEdit('${t.id}')">
        <button class="check-btn" onclick="toggleDone(event,'${t.id}')">${t.done ? '✦' : ''}</button>
        <div class="task-info">
          <div class="task-title">${esc(t.title)}</div>
          <div class="task-meta">
            <span class="task-subject" style="color:${subColor};">${esc(t.subject)}</span>
            ${dl ? `<span class="task-due ${t.done ? 'done' : u}">${dl}</span>` : ''}
          </div>
          ${t.note ? `<div class="task-note">${esc(t.note)}</div>` : ''}
        </div>
        <div class="task-priority">${t.priority || '🔵'}</div>
      </div>`;
  }).join('');
}

// ── Toggle done ──
function toggleDone(e, id) {
  e.stopPropagation();
  const t = tasks.find(x => x.id === id);
  if (t) { t.done = !t.done; saveTasks(); renderTasks(); }
}

// ── Filter tabs ──
document.querySelector('.tabs-wrap').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  filter = tab.dataset.filter;
  const labels = { all:'All tasks', pending:'Pending', done:'Completed ✦', urgent:'Urgent', soon:'Due soon' };
  document.getElementById('section-label').textContent = labels[filter] || 'Tasks';
  renderTasks();
});

// ── FAB ──
document.getElementById('fab-btn').onclick = () => openAdd();

// ── Open add ──
function openAdd() {
  editingId = null;
  document.getElementById('panel-title').textContent = 'New Task';
  document.getElementById('f-title').value = '';
  document.getElementById('f-subject').value = 'Literature';
  document.getElementById('f-note').value = '';
  const tmr = new Date(); tmr.setDate(tmr.getDate() + 3);
  document.getElementById('f-due').value = tmr.toISOString().split('T')[0];
  document.getElementById('btn-delete').style.display = 'none';
  selectPriority('🔴');
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 50);
}

// ── Open edit ──
function openEdit(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  editingId = id;
  document.getElementById('panel-title').textContent = t.title || 'Edit Task';
  document.getElementById('f-title').value = t.title;
  document.getElementById('f-subject').value = t.subject;
  document.getElementById('f-due').value = t.due || '';
  document.getElementById('f-note').value = t.note || '';
  document.getElementById('btn-delete').style.display = '';
  selectPriority(t.priority || '🔴');
  document.getElementById('overlay').classList.add('open');
}

// ── Priority buttons ──
document.querySelector('.priority-row').addEventListener('click', e => {
  const btn = e.target.closest('.priority-btn');
  if (btn) selectPriority(btn.dataset.p);
});
function selectPriority(p) {
  selectedPriority = p;
  document.querySelectorAll('.priority-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.p === p);
  });
}

// ── Save ──
document.getElementById('btn-save').onclick = () => {
  const title   = document.getElementById('f-title').value.trim();
  const subject = document.getElementById('f-subject').value;
  const due     = document.getElementById('f-due').value;
  const note    = document.getElementById('f-note').value.trim();
  if (!title) return;

  if (editingId) {
    const idx = tasks.findIndex(t => t.id === editingId);
    if (idx > -1) tasks[idx] = { ...tasks[idx], title, subject, due, note, priority: selectedPriority };
  } else {
    tasks.push({ id: Date.now().toString(), title, subject, due, note, priority: selectedPriority, done: false });
  }
  saveTasks(); closeOverlay(); renderTasks();
};

// ── Delete ──
document.getElementById('btn-delete').onclick = () => {
  if (!editingId) return;
  tasks = tasks.filter(t => t.id !== editingId);
  saveTasks(); closeOverlay(); renderTasks();
};

// ── Cancel / close ──
document.getElementById('btn-cancel').onclick = closeOverlay;
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeOverlay();
});
function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

renderTasks();
</script>
</body>
</html>
