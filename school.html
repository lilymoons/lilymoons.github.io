<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lily's School" />
  <meta name="theme-color" content="#060812" />
  <title>Lily's School ✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060812;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      color: #c8cbdf;
    }

    .phone {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #0a0d1a;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px 8px;
      font-size: 12px;
      color: #8891b8;
      font-weight: 500;
    }

    /* Header */
    .header-area {
      padding: 10px 22px 18px;
      border-bottom: 1px solid #141830;
      position: relative;
    }
    .star-deco {
      position: absolute;
      top: 18px; right: 22px;
      font-size: 9px;
      color: #2a3060;
      letter-spacing: 2px;
    }
    .back-link {
      font-size: 12px;
      color: #5c6494;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 14px;
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .back-link:hover { color: #7b83c9; }
    .school-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: #e8eaf6;
      letter-spacing: -0.01em;
      margin-bottom: 3px;
    }
    .school-title span { color: #7b83c9; }
    .school-sub {
      font-size: 11px;
      color: #4a5280;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .day-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #111528;
      border: 1px solid #1e2548;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      color: #7b83c9;
      margin-top: 12px;
    }
    .dot { width: 5px; height: 5px; background: #5c6fd4; border-radius: 50%; }

    /* Section Labels */
    .section-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #353a60;
      padding: 18px 22px 10px;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 14px;
    }
    .card {
      background: #0e1123;
      border: 1px solid #1a1f3a;
      border-radius: 16px;
      padding: 16px 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      display: block;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      border-radius: 16px 16px 0 0;
    }
    .card.notes::before   { background: #5c6fd4; }
    .card.schedule::before { background: #a07fc9; }
    .card.homework::before { background: #5ba8a0; }
    .card.grades::before  { background: #c97fa0; }
    .card:hover { background: #12162b; border-color: #262d52; }
    .card-icon {
      font-size: 24px;
      margin-bottom: 10px;
      display: block;
    }
    .card-name {
      font-size: 13px;
      font-weight: 500;
      color: #c8cbdf;
      margin-bottom: 3px;
    }
    .card-desc {
      font-size: 11px;
      color: #3d4268;
      line-height: 1.4;
    }
    .card-badge {
      position: absolute;
      top: 10px; right: 10px;
      background: #1e2548;
      border-radius: 8px;
      padding: 2px 7px;
      font-size: 10px;
      color: #5c6fd4;
      font-weight: 500;
    }

    /* Today's Classes */
    .today-strip {
      margin: 0 14px;
      background: #0e1123;
      border: 1px solid #1a1f3a;
      border-radius: 16px;
      padding: 14px 16px;
    }
    .today-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .today-label {
      font-size: 13px;
      color: #c8cbdf;
      font-weight: 500;
    }
    .today-all {
      font-size: 11px;
      color: #3d4268;
      text-decoration: none;
      cursor: pointer;
    }
    .today-all:hover { color: #7b83c9; }
    .class-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #111528;
    }
    .class-row:last-child { border-bottom: none; }
    .class-time {
      font-size: 11px;
      color: #3d4268;
      width: 38px;
      flex-shrink: 0;
    }
    .class-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .class-name {
      font-size: 12px;
      color: #9ba3cc;
      flex: 1;
    }
    .class-room {
      font-size: 11px;
      color: #2e3357;
    }

    /* Bottom Nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 14px 10px 28px;
      margin-top: auto;
      border-top: 1px solid #111528;
      background: #0a0d1a;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #2e3357;
      cursor: pointer;
      padding: 4px 14px;
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-item.active { color: #7b83c9; }
    .nav-item:hover { color: #5c6494; }
    .nav-icon { font-size: 20px; }
  </style>
</head>
<body>
  <div class="phone">

    <div class="status-bar">
      <span id="clock">9:41</span>
      <span>✦✦✦</span>
    </div>

    <div class="header-area">
      <div class="star-deco">✦ ✦ ✦</div>
      <a class="back-link" href="index.html">← Lily's World</a>
      <div class="school-title">Lily's <span>School</span></div>
      <div class="school-sub">Student Portal</div>
      <div class="day-pill">
        <div class="dot"></div>
        <span id="today-day">Monday</span>
      </div>
    </div>

    <div class="section-label">Quick Access</div>
    <div class="cards-grid">
      <a class="card notes" href="notes.html">
        <span class="card-icon">📓</span>
        <div class="card-name">My Notes</div>
        <div class="card-desc">Subjects & stickers</div>
        <div class="card-badge">New</div>
      </a>
      <a class="card schedule" href="schedule.html">
        <span class="card-icon">🗓</span>
        <div class="card-name">Schedule</div>
        <div class="card-desc">Weekly timetable</div>
      </a>
      <a class="card homework" href="homework.html">
        <span class="card-icon">📌</span>
        <div class="card-name">Homework</div>
        <div class="card-desc">Due dates & tasks</div>
      </a>
      <a class="card grades" href="grades.html">
        <span class="card-icon">⭐</span>
        <div class="card-name">Grades</div>
        <div class="card-desc">Progress tracker</div>
      </a>
    </div>

    <div class="section-label" style="margin-top:6px;">Today's Classes</div>
    <div class="today-strip">
      <div class="today-header">
        <div class="today-label" id="today-full">Monday</div>
        <a class="today-all" href="schedule.html">view all →</a>
      </div>
      <div id="class-list">
        <!-- Populated by JS based on day -->
      </div>
    </div>

    <nav class="bottom-nav">
      <a class="nav-item active" href="school.html">
        <div class="nav-icon">🏠</div>
        <span>Home</span>
      </a>
      <a class="nav-item" href="notes.html">
        <div class="nav-icon">📓</div>
        <span>Notes</span>
      </a>
      <a class="nav-item" href="schedule.html">
        <div class="nav-icon">🗓</div>
        <span>Schedule</span>
      </a>
      <a class="nav-item" href="homework.html">
        <div class="nav-icon">📌</div>
        <span>Tasks</span>
      </a>
    </nav>

  </div>

  <script>
    // Live clock
    function updateClock() {
      const d = new Date();
      const h = d.getHours().toString().padStart(2, '0');
      const m = d.getMinutes().toString().padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m;
    }
    updateClock();
    setInterval(updateClock, 60000);

    // Day name
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const dayName = days[new Date().getDay()];
    document.getElementById('today-day').textContent = dayName;
    document.getElementById('today-full').textContent = dayName;

    // Schedule data — edit these to match Lily's real classes!
    const schedule = {
      Monday:    [
        { time: '8:30',  name: 'Literature',   room: 'Rm 204', color: '#5c6fd4' },
        { time: '10:00', name: 'Mathematics',  room: 'Rm 118', color: '#a07fc9' },
        { time: '13:00', name: 'Art & Design', room: 'Studio',  color: '#5ba8a0' },
        { time: '14:30', name: 'Photography',  room: 'Rm 301', color: '#c97fa0' },
      ],
      Tuesday:   [
        { time: '9:00',  name: 'History',      room: 'Rm 205', color: '#5c6fd4' },
        { time: '11:00', name: 'Music',         room: 'Hall B', color: '#a07fc9' },
        { time: '14:00', name: 'PE',            room: 'Gym',    color: '#5ba8a0' },
      ],
      Wednesday: [
        { time: '8:30',  name: 'Mathematics',  room: 'Rm 118', color: '#a07fc9' },
        { time: '10:00', name: 'Literature',   room: 'Rm 204', color: '#5c6fd4' },
        { time: '13:00', name: 'Science',      room: 'Lab 2',  color: '#5ba8a0' },
      ],
      Thursday:  [
        { time: '9:00',  name: 'Art & Design', room: 'Studio',  color: '#5ba8a0' },
        { time: '11:30', name: 'History',      room: 'Rm 205', color: '#5c6fd4' },
        { time: '14:00', name: 'Photography',  room: 'Rm 301', color: '#c97fa0' },
      ],
      Friday:    [
        { time: '8:30',  name: 'Science',      room: 'Lab 2',  color: '#5ba8a0' },
        { time: '10:00', name: 'Music',         room: 'Hall B', color: '#a07fc9' },
        { time: '13:00', name: 'Free Period',   room: '—',      color: '#353a60' },
      ],
      Saturday:  [],
      Sunday:    [],
    };

    const todayClasses = schedule[dayName] || [];
    const list = document.getElementById('class-list');

    if (todayClasses.length === 0) {
      list.innerHTML = '<div style="font-size:12px;color:#3d4268;padding:10px 0;text-align:center;">No classes today ✦ enjoy the day!</div>';
    } else {
      list.innerHTML = todayClasses.map(c => `
        <div class="class-row">
          <div class="class-time">${c.time}</div>
          <div class="class-dot" style="background:${c.color};"></div>
          <div class="class-name">${c.name}</div>
          <div class="class-room">${c.room}</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
